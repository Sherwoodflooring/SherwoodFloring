<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sherwood Flooring</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header {
      background: #2e4d2e;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #3a5d3a;
    }
    nav button {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      padding: 14px 20px;
      cursor: pointer;
    }
    nav button:hover {
      background: #4d7a4d;
    }
    section {
      display: none;
      padding: 20px;
    }
    section.active {
      display: block;
      animation: fadeIn 0.4s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .images {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .images img {
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    footer {
      background: #2e4d2e;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Sherwood Flooring</h1>
</header>

<nav>
  <button onclick="showTab('services')">Services</button>
  <button onclick="showTab('gallery')">Gallery</button>
  <button onclick="showTab('contact')">Contact</button>
</nav>

<section id="services" class="active">
  <h2>Our Services</h2>
  <p>Professional installation of laminate, hardwood, and vinyl flooring in Vancouver and surrounding areas.</p>
</section>

<section id="gallery">
  <h2>Gallery</h2>
  <div class="images">
    <img src="floor1.jpg" alt="Project 1">
    <img src="floor2.jpg" alt="Project 2">
    <img src="floor3.jpg" alt="Project 3">
    <img src="floor4.jpg" alt="Project 4">
    <img src="floor5.jpg" alt="Project 5">

  </div>
</section>

<section id="contact">
  <h2>Contact Us</h2>
  <p><strong>Phone:</strong> +1 236 865 9939</p>
  <p><strong>Email:</strong> loxodaserty@gmail.com</p>
  <p><strong>Location:</strong> Vancouver, BC</p>
</section>

<footer>
  &copy; 2025 Sherwood Flooring. All rights reserved.
</footer>

<script>
  function showTab(id) {
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
